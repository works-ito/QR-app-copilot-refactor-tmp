<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f3f6fa">
  <title>QR在庫管理 ver.3</title>
  <link rel="stylesheet" href="./styles.css?v=1">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <div class="brand">
        <h1>QR在庫管理</h1>
        <p>WORKS Co., Ltd. <span class="version">ver.3</span></p>
      </div>
      <button id="backButton" class="header-button" type="button" hidden>戻る</button>
    </header>

    <section class="status-bar" aria-live="polite">
      <span id="dataStatus" class="status-dot is-ready"></span>
      <span id="statusText">準備完了</span>
    </section>

    <section class="card">
      <div class="step-heading">
        <p id="stepCount" class="step-count">STEP 1 / 4</p>
        <h2 id="stepTitle">受付方法を選択</h2>
        <p id="stepGuide" class="step-guide">通常の入出庫またはイレギュラー受付を選んでください。</p>
      </div>

      <div id="choices" class="choice-grid"></div>

      <div class="footer-actions">
        <button id="nextButton" class="primary-button" type="button" disabled>次へ</button>
      </div>
    </section>

    <section class="selection-summary" aria-live="polite">
      <h2>選択内容</h2>
      <dl id="summary"></dl>
    </section>
  </main>

  <template id="choiceTemplate">
    <button class="choice-button" type="button">
      <span class="choice-title"></span>
      <span class="choice-note"></span>
    </button>
  </template>

  <script src="./app.js?v=1" defer></script>
</body>
</html>
